<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-labelledby="t d">
  <title id="t">Two ways to search</title>
  <desc id="d">Diagram with placeholder names. Kind of thing: type a kind of item and get several similar checked products, cheapest shelf price first. Exact product: type one product's name and get the single closest name match with its own page's price and any coupon that page printed.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #16161d; }
    .h { font-size: 22px; font-weight: 800; }
    .sub { font-size: 16px; fill: #3f3f4e; }
    .pill { font-size: 16px; fill: #3f3f4e; }
    .name { font-size: 17px; font-weight: 700; }
    .tag { font-size: 14px; fill: #55556a; }
    .cap { font-size: 16px; fill: #16161d; }
    .note { font-size: 14px; fill: #55556a; }
    .card { fill: #ffffff; stroke: #c9ced8; stroke-width: 1.5; }
    .hit { fill: #ffffff; stroke: #422ad5; stroke-width: 3; }
    .arrow { fill: none; stroke: #422ad5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="880" height="428" fill="#f6f6f9"/>

  <!-- panel 1 -->
  <g transform="translate(24 24)">
    <circle cx="14" cy="14" r="14" fill="#422ad5"/>
    <text x="14" y="20" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" style="fill:#ffffff">1</text>
    <text x="40" y="22" class="h">Kind of thing</text>
    <text x="0" y="56" class="sub">Search for a kind of item.</text>
    <rect x="0" y="72" width="388" height="40" rx="20" fill="#ffffff" stroke="#8b8ea0" stroke-width="1.5"/>
    <text x="20" y="98" class="pill">a kind of item</text>
    <path class="arrow" d="M194 122 v22 m-8 -8 l8 8 l8 -8"/>
    <rect class="card" x="0" y="154" width="388" height="40" rx="8"/>
    <text x="16" y="180" class="name">Product A</text><text x="372" y="180" class="tag" text-anchor="end">shelf price</text>
    <rect class="card" x="0" y="202" width="388" height="40" rx="8"/>
    <text x="16" y="228" class="name">Product B</text><text x="372" y="228" class="tag" text-anchor="end">shelf price</text>
    <rect class="card" x="0" y="250" width="388" height="40" rx="8"/>
    <text x="16" y="276" class="name">Product C</text><text x="372" y="276" class="tag" text-anchor="end">shelf price</text>
    <text x="0" y="322" class="cap">Several similar checked products,</text>
    <text x="0" y="344" class="cap">cheapest shelf price first.</text>
  </g>

  <!-- divider -->
  <line x1="440" y1="28" x2="440" y2="360" stroke="#d6d9e2" stroke-width="1.5"/>

  <!-- panel 2 -->
  <g transform="translate(468 24)">
    <circle cx="14" cy="14" r="14" fill="#422ad5"/>
    <text x="14" y="20" font-size="16" font-weight="800" text-anchor="middle" style="fill:#ffffff">2</text>
    <text x="40" y="22" class="h">Exact product</text>
    <text x="0" y="56" class="sub">Search for one named item.</text>
    <rect x="0" y="72" width="388" height="40" rx="20" fill="#ffffff" stroke="#8b8ea0" stroke-width="1.5"/>
    <text x="20" y="98" class="pill">that product's name</text>
    <path class="arrow" d="M194 122 v22 m-8 -8 l8 8 l8 -8"/>
    <rect class="hit" x="0" y="154" width="388" height="40" rx="8"/>
    <text x="16" y="180" class="name">Product A</text><text x="372" y="180" class="tag" text-anchor="end">shelf price</text>
    <rect x="0" y="202" width="388" height="40" rx="8" fill="none" stroke="#c9ced8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="194" y="228" class="tag" text-anchor="middle">other matches are not listed</text>
    <text x="0" y="322" class="cap">The single closest name match, with its own</text>
    <text x="0" y="344" class="cap">page's price and any coupon that page printed.</text>
  </g>

  <text x="24" y="408" class="note">Diagram: placeholder names, no real products or prices.</text>
</svg>
